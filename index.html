<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健身记录页面</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Workout Log</p>
      <h1 id="page-title">健身记录页面</h1>
      <p class="intro">
        输入每次训练的日期、时长、动作、组数和每组重量，提交后可以在下方看到本次记录。
      </p>
      <ol class="quick-steps" aria-label="使用步骤">
        <li><strong>第 1 步：</strong>找到项目文件夹 <code>111</code>，打开里面的 <code>index.html</code>。</li>
        <li><strong>第 2 步：</strong>按表单提示填写训练内容。</li>
        <li><strong>第 3 步：</strong>点击“保存记录”，在下方查看结果。</li>
      </ol>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增训练记录</h2>
      <form id="workout-form" class="workout-form">
        <label>
          训练日期
          <input type="date" id="training-date" name="trainingDate" required />
        </label>

        <label>
          训练时长（分钟）
          <input type="number" id="duration" name="duration" min="1" step="1" placeholder="例如：60" required />
        </label>

        <label>
          动作名称
          <input type="text" id="exercise" name="exercise" placeholder="例如：深蹲" required />
        </label>

        <label>
          组数
          <input type="number" id="sets" name="sets" min="1" step="1" placeholder="例如：4" required />
        </label>

        <label>
          每组重量（公斤）
          <input type="number" id="weight" name="weight" min="0" step="0.5" placeholder="例如：80" required />
        </label>

        <button type="submit">保存记录</button>
      </form>
    </section>

    <section class="card" aria-labelledby="records-title">
      <h2 id="records-title">训练记录</h2>
      <p id="empty-state" class="empty-state">还没有记录。填写上面的表单试试看吧！</p>
      <div class="table-wrap">
        <table id="records-table" hidden>
          <thead>
            <tr>
              <th>训练日期</th>
              <th>时长</th>
              <th>动作</th>
              <th>组数</th>
              <th>每组重量</th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
